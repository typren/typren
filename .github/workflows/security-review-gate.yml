# Pre-merge security gate for promotions to main (docs/security-review.md).
#
# A whole-repo security review (the .claude/workflows/security-review.mjs workflow, or the same lenses run
# by hand from the runbook) produces a record in security-reviews/. This check only verifies that a clean,
# current record exists for the PR's head commit: no LLM, no secrets, no install, read-only token. That
# keeps it deterministic, free, and identical for every reviewer whatever tool they used.
#
# Plain `pull_request` and no dependency install: the only code it runs is the base repo's own script
# against git metadata. Make "Security review" a required status check on main in branch protection.
name: Security review gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Security review
    runs-on: ubuntu-latest
    steps:
      # The PR's tree and full history: the records and the commits the gate walks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0

      # The gate script itself comes from the BASE branch: running the PR's copy would let a PR edit the
      # gate to pass itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: gate
          sparse-checkout: scripts/check-security-review.mjs
          sparse-checkout-cone-mode: false

      - name: Check for a passing review that covers this commit
        working-directory: pr
        # One-time bootstrap: the promotion that first adds this gate has no base copy to run, so it uses the
        # PR's own copy and says so. Every later run uses the base branch's script.
        run: |
          gate=../gate/scripts/check-security-review.mjs
          if [ ! -f "$gate" ]; then
            echo "::warning::main has no security gate yet; using this PR's copy (bootstrap run only)"
            gate=scripts/check-security-review.mjs
          fi
          node "$gate" --head "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
