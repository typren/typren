# This repo's PR gate, added by typren/typren#23 alongside cla.yml and
# release.yml. See the latter's header for the rest of the workflow set.
#
# CONTEXT: this repo's gates run in the local pre-push hook by design. That
# philosophy assumed maintainer-only pushes; outside contributors' machines
# don't run our hooks, so a PR CI workflow is now the trust boundary for
# external contributions. This is a deliberate extension of that philosophy,
# not an accident: nothing here duplicates the hook for maintainers (their
# push already ran it, see the `ci/local` commit status), it exists purely to
# give a fork-based contributor the same gate before a human ever reviews the
# diff.
#
# Plain `pull_request`, not `pull_request_target`: this workflow builds and
# executes a contributor's own code (bun install, build, test), which is
# exactly what `pull_request_target`'s base-repo context and write-capable
# token must never be handed. Read-only `contents: read` below, no secrets in
# scope, nothing a hostile fork PR can do with this run beyond burning CI
# minutes. cla.yml is the one workflow in this repo that legitimately needs
# pull_request_target, and it never checks out PR code either way.
name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Unshallow: both the changeset check and coverage:new's new-code
          # gate (below) need to diff against origin/develop, not just the
          # PR's own commits.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # Same gate `bun run verify` runs in the local pre-push hook (build,
      # typecheck, lint, test with coverage, the new-code coverage floor,
      # check:scaffold, check:api-surface). COVERAGE_BASE_REF overrides that
      # gate's default (origin/main): PRs land on develop, and main can be well
      # behind it (release is a separate promotion), so diffing new-code
      # coverage against main would flag every line since the last release,
      # not just this PR's.
      - run: bun run verify
        env:
          COVERAGE_BASE_REF: origin/develop

      # Changesets already ships a "packages changed but no changeset declared"
      # check natively (`status --since`, exit 1) — no need for a bespoke
      # script. Note the check is repo-global, not per-package: ANY changeset
      # on the branch clears ALL touched packages, so it enforces "the author
      # thought about releasing", not "every touched package is covered". A
      # change that shouldn't bump anything (docs, tests, CI) still needs
      # `changeset add --empty` to clear it, which is the correct way to say
      # "seen, no release" rather than the check having a separate
      # docs/tests/CI carve-out it has to get right.
      #
      # The one legitimate carve-out is the Version Packages PR itself:
      # `changeset version` consumes the changeset files while bumping
      # package versions, so the release PR always trips this check. That
      # carve-out is keyed on `head_ref`, a plain string a fork PR controls
      # (its own branch name), so it also requires the PR's head repo to be
      # this one: version-pr.yml only ever pushes changeset-release/develop
      # to this repo, a fork can't produce that combination, and a fork
      # naming its branch "changeset-release/develop" no longer skips the
      # gate.
      - name: Changeset required for package changes
        if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: bunx changeset status --since=origin/develop
