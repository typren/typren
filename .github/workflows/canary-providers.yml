# Nightly live check of each shipped TMS preset against a real project. Unit tests stub the vendor
# APIs, so a vendor-side change (a new export host, a renamed field, a locale our key check
# rejects) only shows up when someone's build pulls for real. This finds it first and files an
# issue labelled `canary`, which closes itself on the next passing run.
#
# Secrets live in the `canary` environment, never in PR scope: this runs on schedule and manual
# dispatch only, from the default branch, so no contributor code ever sees the tokens. Use
# Typren-owned test projects, never a customer's. A preset with no secrets configured is skipped
# with a warning.
name: Canary (providers)

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-providers
  cancel-in-progress: false

jobs:
  provider:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    environment: canary
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        preset: [lokalise, crowdin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @typren/locale build
      - id: check
        run: node scripts/canary/provider.mjs ${{ matrix.preset }}
        env:
          LOKALISE_CANARY_TOKEN: ${{ secrets.LOKALISE_CANARY_TOKEN }}
          LOKALISE_CANARY_PROJECT_ID: ${{ vars.LOKALISE_CANARY_PROJECT_ID }}
          LOKALISE_CANARY_EXPECTED_LOCALES: ${{ vars.LOKALISE_CANARY_EXPECTED_LOCALES }}
          CROWDIN_CANARY_TOKEN: ${{ secrets.CROWDIN_CANARY_TOKEN }}
          CROWDIN_CANARY_PROJECT_ID: ${{ vars.CROWDIN_CANARY_PROJECT_ID }}
          CROWDIN_CANARY_EXPECTED_LOCALES: ${{ vars.CROWDIN_CANARY_EXPECTED_LOCALES }}
      - name: File or close the canary issue
        if: always()
        run: node scripts/canary/report.mjs --title "Canary: ${{ matrix.preset }} preset" --outcome "${{ steps.check.outcome }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
