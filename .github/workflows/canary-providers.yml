# Nightly watch of the TMS vendors we ship presets for, using only public signals (no account, no
# secrets): new releases of Lokalise's own CLI and Node SDK, and whether the lokalise preset's
# export buckets still exist. A change opens an issue labelled `canary`, which closes itself on the
# next passing run. It cannot see a silent infra move the way a real authenticated pull would.
name: Canary (providers)

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-providers
  cancel-in-progress: false

jobs:
  lokalise-signals:
    name: lokalise public signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @typren/locale build
      - id: check
        run: node scripts/canary/lokalise-signals.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: File or close the canary issue
        if: always()
        run: node scripts/canary/report.mjs --title "Canary: Lokalise public signals" --outcome "${{ steps.check.outcome }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
