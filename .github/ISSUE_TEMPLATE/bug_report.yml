name: Bug report
description: Something is not working as expected
labels: ["type: bug", "needs triage"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you do, and what went wrong?
      placeholder: I was trying to... and got an unexpected error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: How should this have behaved instead?
      placeholder: It should have...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      value: |
        1.
        2.
        3.
      placeholder: "1. Start with X\n2. Do Y\n3. Observe Z"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Tell us about your setup
      value: |
        - @typren/core version:
        - @typren/cli version:
        - Node.js version:
        - OS:
      placeholder: "- @typren/core version: 0.1.0\n- @typren/cli version: 0.1.0\n- Node.js version: 20.0.0\n- OS: macOS 14.0"
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Any other context, logs, or screenshots that might help
      placeholder: Error stack trace, screenshots, etc.
    validations:
      required: false
